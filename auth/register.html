<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration — PhysioCare Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#F0FDFA', 100: '#CCFBF1', 200: '#99F6E4', 300: '#5EEAD4',
              400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', 700: '#0F766E',
              800: '#115E59', 900: '#134E4A', 950: '#042F2E',
            },
            slate: {
              750: '#243044', 800: '#1E293B', 850: '#151F30', 900: '#0F172A', 950: '#090D12'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo-mark.svg">
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</head>
<body class="bg-[#F5F7FA] dark:bg-[#090D12] text-slate-600 dark:text-slate-300 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-lg card-base p-8 space-y-6 shadow-2xl relative">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
      <a href="../index.html">
        <img src="../assets/images/logo.svg" alt="PhysioCare" class="h-8 w-auto dark:hidden">
        <img src="../assets/images/logo-white.svg" alt="PhysioCare" class="h-8 w-auto hidden dark:block">
      </a>
      <a href="login.html" class="text-xs text-teal-600 font-bold hover:underline">Have an account? Login</a>
    </div>

    <div class="space-y-1">
      <h1 class="text-2xl font-black text-slate-900 dark:text-white font-heading">Register New Patient Account</h1>
      <p class="text-xs text-slate-500">Create your account to view recovery protocols and manage bookings.</p>
    </div>

    <form onsubmit="handleRegister(event)" class="space-y-4 text-xs">
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Pravin Kumar" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
        </div>
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
          <input type="tel" id="reg-phone" required placeholder="+91 98765 43210" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" id="reg-email" required placeholder="pravin@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
        </div>
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Date of Birth</label>
          <input type="date" id="reg-dob" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" id="reg-pwd" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
        </div>
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
          <input type="password" id="reg-cpwd" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
        </div>
      </div>

      <div class="flex items-start gap-2 pt-1">
        <input type="checkbox" required class="mt-0.5 rounded text-teal-600 focus:ring-teal-500">
        <span class="text-slate-600 dark:text-slate-400">I consent to the clinical privacy policy and electronic medical record management.</span>
      </div>

      <button type="submit" class="btn-primary w-full py-3.5 justify-center font-bold">
        <span>Complete Registration</span>
      </button>
    </form>
  </div>

  <script src="../assets/js/demo-data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      if (window.PhysioStorage) {
        window.PhysioStorage.setSession({
          isLoggedIn: true,
          role: 'patient',
          user: {
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value
          }
        });
      }
      window.location.href = '../patient/index.html';
    }
  </script>
</body>
</html>
