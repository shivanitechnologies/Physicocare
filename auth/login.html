<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login — PhysioCare Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#F0FDFA', 100: '#CCFBF1', 200: '#99F6E4', 300: '#5EEAD4',
              400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', 700: '#0F766E',
              800: '#115E59', 900: '#134E4A', 950: '#042F2E',
            },
            slate: {
              750: '#243044', 800: '#1E293B', 850: '#151F30', 900: '#0F172A', 950: '#090D12'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo-mark.svg">
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</head>
<body class="bg-[#F5F7FA] dark:bg-[#090D12] text-slate-600 dark:text-slate-300 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-md card-base p-8 space-y-6 shadow-2xl relative">
    
    <!-- Top RTL & Theme Switcher Controls -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.svg" alt="PhysioCare" class="h-8 w-auto dark:hidden">
        <img src="../assets/images/logo-white.svg" alt="PhysioCare" class="h-8 w-auto hidden dark:block">
      </a>
      <div class="flex items-center gap-2">
        <button type="button" class="rtl-toggle-btn w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-teal-600 flex items-center justify-center text-xs" title="Toggle RTL">⇄</button>
        <button type="button" class="theme-toggle-btn w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-teal-600 flex items-center justify-center text-xs" aria-label="Toggle theme">
          <span class="theme-icon-moon">🌙</span>
          <span class="theme-icon-sun hidden">☀️</span>
        </button>
      </div>
    </div>

    <div class="space-y-1 text-center">
      <h1 class="text-2xl font-black text-slate-900 dark:text-white font-heading">Patient Portal Login</h1>
      <p class="text-xs text-slate-500">Access your recovery plan, exercises &amp; scheduled visits.</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
        <input type="email" id="login-email" required value="pravin.kumar@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-600 outline-none">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Password</label>
          <a href="forgot-password.html" class="text-teal-600 hover:underline">Forgot?</a>
        </div>
        <div class="relative">
          <input type="password" id="login-pwd" required value="physio123" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-600 outline-none pr-10">
          <button type="button" onclick="togglePwdVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">👁️</button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked class="rounded text-teal-600 focus:ring-teal-500">
          <span class="text-slate-600 dark:text-slate-400">Remember Me</span>
        </label>
      </div>

      <button type="submit" class="btn-primary w-full py-3.5 justify-center font-bold">
        <span>Sign In to Portal</span>
      </button>

      <div class="pt-2 text-center text-slate-500 border-t border-slate-100 dark:border-slate-800">
        Don't have an account? <a href="register.html" class="font-bold text-teal-600 hover:underline">Register here</a>
      </div>
    </form>
  </div>

  <script src="../assets/js/demo-data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    function togglePwdVisibility() {
      const inp = document.getElementById('login-pwd');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      if (window.PhysioStorage) {
        window.PhysioStorage.setSession({
          isLoggedIn: true,
          role: 'patient',
          user: { name: 'Pravin Kumar', email: email }
        });
      }
      window.location.href = '../patient/index.html';
    }
  </script>
</body>
</html>
