<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PhysioCare Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#F0FDFA', 100: '#CCFBF1', 200: '#99F6E4', 300: '#5EEAD4',
              400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488', 700: '#0F766E',
              800: '#115E59', 900: '#134E4A', 950: '#042F2E',
            },
            slate: {
              750: '#243044', 800: '#1E293B', 850: '#151F30', 900: '#0F172A', 950: '#090D12'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo-mark.svg">
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</head>
<body class="bg-[#F5F7FA] dark:bg-[#090D12] text-slate-600 dark:text-slate-300 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-md card-base p-8 space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <a href="../index.html" class="inline-block">
        <img src="../assets/images/logo.svg" alt="PhysioCare" class="h-8 w-auto dark:hidden mx-auto">
        <img src="../assets/images/logo-white.svg" alt="PhysioCare" class="h-8 w-auto hidden dark:block mx-auto">
      </a>
      <h1 class="text-xl font-bold text-slate-900 dark:text-white font-heading">Reset Your Password</h1>
      <p class="text-xs text-slate-500">Enter your registered email and we will send a password reset code.</p>
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='reset-password.html';" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
        <input type="email" required placeholder="your.email@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-teal-600">
      </div>
      <button type="submit" class="btn-primary w-full py-3 justify-center">
        <span>Send Reset Link</span>
      </button>
      <div class="text-center pt-2">
        <a href="login.html" class="text-xs font-bold text-teal-600 hover:underline">&larr; Return to Login</a>
      </div>
    </form>
  </div>
</body>
</html>
