<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="physioTealGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="physioAccentGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2DD4BF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dynamic Human Mobility / Spine Arc Emblem -->
  <g transform="translate(6, 4)" filter="url(#glowW)">
    <path d="M14 46 C 14 36, 26 34, 28 26 C 30 18, 20 14, 26 6 C 30 0, 42 6, 40 16 C 38 26, 22 28, 22 38 C 22 46, 32 48, 38 48" 
          stroke="url(#physioAccentGradW)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M26 18 C 34 18, 48 24, 46 38 C 45 44, 38 48, 30 48 C 22 48, 14 42, 16 34 C 18 26, 26 22, 34 20" 
          stroke="url(#physioTealGradW)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 1" fill="none" opacity="0.75"/>
    <circle cx="28" cy="6" r="4.5" fill="url(#physioAccentGradW)" />
    <circle cx="26" cy="20" r="2.5" fill="#5EEAD4" />
    <circle cx="34" cy="32" r="2" fill="#38BDF8" />
    <circle cx="20" cy="40" r="2.5" fill="#14B8A6" />
  </g>

  <!-- Typography: PhysioCare -->
  <g transform="translate(62, 38)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Physio<tspan fill="#2DD4BF">Care</tspan>
    </text>
  </g>
</svg>
